<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MaiGame</title>
<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
body{background:#c8d9bd;color:#171717}
#game{position:relative;width:100%;height:100dvh;overflow:hidden;background:linear-gradient(#c8d9bdcc,#c8d9bdcc),url('assets/background.png') center/cover}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;z-index:5;gap:8px}
.pill{border:2.5px solid #171717;border-radius:30px;padding:6px 14px;background:#dce8d3e8;font-weight:800;font-size:16px;white-space:nowrap}
#title{font-weight:1000;font-size:clamp(24px,7vw,44px);letter-spacing:-1px;text-shadow:2px 2px #fff,-2px -2px #fff,2px -2px #fff,-2px 2px #fff;white-space:nowrap}
#brand{position:absolute;top:37%;left:50%;transform:translate(-50%,-50%);width:86%;text-align:center;opacity:.35;pointer-events:none;font-weight:1000;line-height:.9;letter-spacing:2px;color:#24362c}
#brand .studio{font-size:clamp(48px,14vw,90px)} #brand .orbit{font-size:clamp(18px,5vw,30px);letter-spacing:5px}
#items,#fx{position:absolute;inset:0;pointer-events:none}
.fall{position:absolute;width:clamp(54px,15vw,86px);height:auto;filter:drop-shadow(0 2px 0 #fff);will-change:transform}
#player{position:absolute;width:clamp(130px,34vw,190px);height:auto;bottom:28px;left:50%;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 3px 0 #fff);touch-action:none}
#ground{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);width:34%;height:12px;border-radius:50%;background:#6e806b99}
#overlay{position:absolute;inset:0;background:#d2dfc8d9;display:flex;align-items:center;justify-content:center;z-index:10;padding:24px}
.card{max-width:340px;width:100%;border:3px solid #171717;border-radius:28px;background:#e9f0e2;padding:25px 20px;text-align:center;box-shadow:7px 7px 0 #74866b}
.card h1{font-size:42px;margin:0 0 10px;font-weight:1000;text-shadow:2px 2px #fff}
.card p{font-weight:700;line-height:1.6}
button{border:2px solid #171717;background:#b7d09f;border-radius:18px;padding:12px 25px;font-size:20px;font-weight:900;box-shadow:3px 3px 0 #171717}
#pause{position:absolute;right:12px;top:70px;z-index:6;border-radius:50%;padding:7px 12px;font-size:16px}
#toast{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-size:24px;font-weight:1000;text-shadow:2px 2px white;z-index:4}
</style></head>
<body><div id="game">
<div id="top"><div class="pill">分數 <span id="score">0</span></div><div id="title">✦ MaiGame ✦</div><div class="pill">最高 <span id="best">0</span></div></div>
<div id="brand"><div class="orbit">✦ MAIMINE ✦</div><div class="studio">STUDIO</div></div>
<div id="items"></div><div id="fx"></div><div id="toast"></div>
<div id="ground"></div><img id="player" src="assets/alien_player.png" alt="MaiGame alien player">
<button id="pause" hidden>Ⅱ</button>
<div id="overlay"><div class="card"><h1>MaiGame</h1><p>👽 接住外星人 +10<br>🛸 接住飛碟 +20<br>😈 避開小惡魔！<br><small>左右滑動控制角色</small></p><button id="start">開始遊戲</button></div></div>
</div>
<script>
const $=s=>document.querySelector(s), game=$('#game'), player=$('#player'), items=$('#items'), overlay=$('#overlay'), startBtn=$('#start'), pauseBtn=$('#pause');
let score=0,best=Number(localStorage.getItem('maigame-best')||0),running=false,paused=false,last=0,spawn=0,elapsed=0,objects=[],px=.5;
$('#best').textContent=best;
const types=[{src:'assets/alien_cute.png',points:10},{src:'assets/ufo.png',points:20},{src:'assets/devil.png',bad:true}];
function setPlayer(x){px=Math.max(.08,Math.min(.92,x));player.style.left=(px*100)+'%';player.style.transform='translateX(-50%)'}
function start(){score=0;elapsed=0;objects.forEach(o=>o.el.remove());objects=[];items.innerHTML='';$('#score').textContent=0;overlay.hidden=true;running=true;paused=false;pauseBtn.hidden=false;last=performance.now();requestAnimationFrame(loop)}
function end(){running=false;pauseBtn.hidden=true;overlay.hidden=false;overlay.querySelector('h1').textContent='遊戲結束';overlay.querySelector('p').innerHTML=`你的分數：${score}<br>最高分：${best}<br>再來挑戰一次？`;startBtn.textContent='重新開始'}
function loop(t){if(!running)return;if(paused){requestAnimationFrame(loop);return}let dt=Math.min((t-last)/1000,.04);last=t;elapsed+=dt;spawn+=dt;
let interval=Math.max(.42,1.02-elapsed*.008);if(spawn>interval){spawn=0;makeItem()}
objects.forEach((o,i)=>{o.y+=o.speed*dt;o.rot+=o.spin*dt;o.el.style.transform=`translate(${o.x}px,${o.y}px) rotate(${o.rot}deg)`;let r=o.el.getBoundingClientRect(),p=player.getBoundingClientRect();if(r.bottom>p.top+25&&r.top<p.bottom&&r.right>p.left+18&&r.left<p.right-18){if(o.bad){end();return}else{score+=o.points;$('#score').textContent=score;if(score>best){best=score;localStorage.setItem('maigame-best',best);$('#best').textContent=best}o.el.remove();objects.splice(i,1)}}else if(o.y>innerHeight+100){o.el.remove();objects.splice(i,1)}});
if(running)requestAnimationFrame(loop)}
function makeItem(){let type=types[Math.random()<.56?0:Math.random()<.72?1:2],el=document.createElement('img');el.src=type.src;el.className='fall';let size=Math.max(54,Math.min(86,innerWidth*.15));el.style.width=size+'px';items.appendChild(el);let x=Math.random()*(innerWidth-size),y=-size;objects.push({el,x,y,rot:Math.random()*60-30,spin:(Math.random()*150-75),speed:190+elapsed*5+Math.random()*65,points:type.points||0,bad:!!type.bad})}
function pointer(e){let rect=game.getBoundingClientRect();setPlayer((e.clientX-rect.left)/rect.width)}
game.addEventListener('pointerdown',e=>{game.setPointerCapture?.(e.pointerId);pointer(e)});game.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer(e)});
startBtn.onclick=start;pauseBtn.onclick=()=>{paused=!paused;pauseBtn.textContent=paused?'▶':'Ⅱ';if(!paused){last=performance.now();requestAnimationFrame(loop)}};
setPlayer(.5);
</script></body></html><style>
/* Fix: the overlay uses display:flex, which overrides the browser's default
   [hidden] display:none rule. Explicitly hide it when game starts. */
#overlay[hidden]{display:none !important}
</style>
